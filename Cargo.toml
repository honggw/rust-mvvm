[workspace]
resolver = "2"
members = [
    "crates/mvvm-reactive",
    "crates/mvvm-core",
    "crates/mvvm-gpui",
    "examples/todo-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"

[workspace.dependencies]
reactive_graph = "0.2.16"
thiserror = "2"
gpui-kit = "0.9.1"
